# Конфиг для отладки плагина во вложенном Hyprland.
# Запускается как окно внутри основной сессии: если плагин уронит композитор,
# умрёт только этот экземпляр, а рабочая сессия уцелеет.

monitor = WAYLAND-1, 1280x720@60, 0x0, 1
# Запасное правило: если имя вывода окажется другим, композитор всё равно
# получит валидный режим, а не 0x0 и бесконечный retry.
monitor = , 1280x720@60, auto, 1

# Путь абсолютный: Hyprland не раскрывает ~ в этой директиве. Поправьте под себя.
plugin = /home/bogdan/Projects/hypr-dissolve/build/hypr-dissolve.so

# Длинный fadeOut: плагин берёт из него таймлайн распада. На дефолтных 4 (400 мс)
# эффект просто не успеть разглядеть покадрово.
animations {
    enabled = true
    animation = fadeOut, 1, 20, linear
    animation = windowsOut, 1, 20, linear, popin 100%
    # Слои идут по своей ветке: у них ни fadeOut, ни windowsOut не спрашивают.
    animation = fadeLayersOut, 1, 20, linear
    animation = layersOut, 1, 20, linear, popin 100%
}

decoration {
    rounding = 8
    blur:enabled = false
    shadow:enabled = false
}

general {
    border_size = 2
    gaps_in = 8
    gaps_out = 16
    col.active_border = rgb(88aaff)
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Яркое окно с контрастным содержимым — на нём распад видно лучше всего.
exec-once = kitty --title dissolve-target --config NONE -o confirm_os_window_close=0 -o background=#2f6fb8 -o foreground=#ffffff -o font_size=20
